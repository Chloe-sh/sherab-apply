<title>방한수련 신청 현황</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F7F3; --card:#FFFFFF; --ink:#212721; --ink2:#4E584C; --mut:#6E7A6C;
  --line:#DFE4D9; --g:#2E8B57; --crit:#A93B2E;
  --shadow:0 1px 2px rgba(33,39,33,.05),0 10px 30px rgba(33,39,33,.07);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A17; --card:#1D231E; --ink:#E9EDE6; --ink2:#B4BEB0; --mut:#93A090;
    --line:#2D342C; --g:#3F9C68; --crit:#E68A78; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161A17; --card:#1D231E; --ink:#E9EDE6; --ink2:#B4BEB0; --mut:#93A090;
  --line:#2D342C; --g:#3F9C68; --crit:#E68A78; --shadow:none;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); min-height:100vh; margin:0;
  display:flex; align-items:center; justify-content:center;
  font-family:"IBM Plex Sans KR","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  padding-inline:20px; padding-block:40px;
}
.lock{
  width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow); padding:36px 32px 30px; text-align:center;
}
.mark{font-size:34px; line-height:1; margin-bottom:14px}
h1{font-family:"Gowun Batang","Noto Serif KR",serif; font-size:21px; font-weight:700;
  margin:0 0 6px; text-wrap:balance}
.desc{font-size:13px; color:var(--mut); margin:0 0 24px; line-height:1.6}
form{display:flex; flex-direction:column; gap:10px}
input[type="password"]{
  width:100%; border:1px solid var(--line); border-radius:10px; background:var(--bg);
  color:var(--ink); font:inherit; font-size:20px; font-variant-numeric:tabular-nums;
  letter-spacing:.35em; text-align:center; padding:11px 8px 11px calc(8px + .35em);
}
input[type="password"]::placeholder{letter-spacing:normal; font-size:14px; color:var(--mut)}
input[type="password"]:focus-visible{outline:2px solid var(--g); outline-offset:1px; border-color:var(--g)}
button{
  border:none; border-radius:10px; background:var(--g); color:#fff; font:inherit;
  font-size:15px; font-weight:700; padding:11px; cursor:pointer;
}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
button[disabled]{opacity:.6; cursor:default}
.err{font-size:13px; color:var(--crit); min-height:20px; margin:10px 0 0}
.foot{font-size:11.5px; color:var(--mut); margin-top:18px}
</style>

<div class="lock">
  <div class="mark">🧘</div>
  <h1>방한수련 신청 현황</h1>
  <p class="desc">관계자 공유용 페이지입니다.<br>비밀번호를 입력하면 열립니다.</p>
  <form id="f">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off"
           placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button id="btn" type="submit">열기</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <p class="foot">2026 쉐랍 텐진 방한수련 · 수행 5개 통합</p>
</div>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: b64(P.salt), iterations: 310000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function attempt(pw, silent){
  if (!pw) return;
  const btn = $("btn"); btn.disabled = true; btn.textContent = "여는 중…";
  try {
    const html = await decrypt(pw);
    try { sessionStorage.setItem("bh-ok", pw); } catch(e){}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false; btn.textContent = "열기";
    if (!silent){
      $("err").textContent = "비밀번호가 올바르지 않습니다.";
      $("pw").select();
    }
  }
}
$("f").addEventListener("submit", ev => {
  ev.preventDefault();
  $("err").textContent = "";
  attempt($("pw").value.trim(), false);
});
// 같은 탭에서 새로고침 시 자동 잠금 해제
try {
  const saved = sessionStorage.getItem("bh-ok");
  if (saved) attempt(saved, true);
} catch(e){}
})();
